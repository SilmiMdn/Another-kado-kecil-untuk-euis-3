<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Another Kado Kecil untuk Pernikahan Euis dan Emir</title>
    <!-- Mengambil font estetik dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .card {
            background-color: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 90%;
            width: 400px;
            border-top: 5px solid #d4a373;
        }

        .icon-container {
            font-size: 50px;
            margin-bottom: 20px;
            /* Animasi detak jantung */
            animation: pulse 1.5s infinite;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 15px;
        }

        p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .status-badge {
            display: inline-block;
            background-color: #f8edeb;
            color: #d4a373;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            🎁
        </div>
        <h1>Another kado kecil dari sahabat Euis</h1>
        <p>Sebuah kado kecil masih sedang disiapkan di balik layar. Simpan link ini dan cek lagi nanti ya!</p>
        <div class="status-badge">
            Status: Sedang Dikerjakan ⏳
        </div>
    </div>

</body>
</html>
